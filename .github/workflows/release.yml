name: Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate and package integration
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package_release.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/proxy-inject-release"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "Proxy Inject $RELEASE_TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/proxy-inject-release/proxy_inject.zip" \
            "$RUNNER_TEMP/proxy-inject-release/proxy_inject.zip.sha256" \
            "${args[@]}"
